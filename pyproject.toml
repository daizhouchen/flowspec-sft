[project]
name = "flowspec-sft"
version = "0.1.0"
description = "Natural-language workflow compilation with validation, simulation and QLoRA recipes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dai Zhouchen" }]
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.8,<3", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
train = [
  "transformers>=4.51,<5",
  "peft>=0.14,<1",
  "datasets>=3,<4",
  "accelerate>=1,<2",
  "bitsandbytes>=0.45,<1; platform_system != 'Windows'",
]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
flowspec-generate = "flowspec.data:main"
flowspec-eval = "flowspec.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowspec"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

